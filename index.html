<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafletJS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>

        //Initialize map
        var map = L.map('map').setView([-7.3161575, 110.1757050
        ], 13);

        // Basemap
        // Tile Layer Base Map
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        var rupabumiindonesia = L.tileLayer('https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Badan Informasi Geospasial'
        });

        var Google_Satellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ["mt0", "mt1", "mt2", "mt3"],
            attribution: 'Google'
        });


        // Menambahkan basemap ke dalam peta
        Google_Satellite.addTo(map);

        // Marker
        var marker = L.marker([-7.3161575, 110.1757050]);

        var marker2 = L.marker([-7.2844873, 110.0589752]);

        var marker3 = L.marker([-7.3597429, 109.9031067]);


        // Popup
        marker.bindPopup("<b>Kabupaten Temanggung</b><br>Kabupaten Temanggung adalah dataran tinggi sejuk di Jawa Tengah antara Gunung Sumbing dan Sindoro yang dikenal sebagai penghasil tembakau dan kopi.");
        marker.openPopup();

        marker2.bindPopup("<b>Kecamatan Bansari</b><br> Kecamatan Bansari adalah sebuah kecamatan sekaligus desa yang terletak di lereng sebelah timur Gunung Sindoro Kabupaten Temanggung. Wilayah ini berada di dataran tinggi dengan ketinggian sekitar 1300 meter di atas permukaan laut sehingga memiliki udara yang sangat sejuk khas pegunungan.");
        marker.openPopup();

        marker3.bindPopup("<b>Kabupaten Wonosobo</b><br> Kabupaten Wonosobo adalah wilayah pegunungan sejuk di Jawa Tengah yang diapit Gunung Sumbing dan Sindoro serta terkenal sebagai pintu gerbang utama menuju Dataran Tinggi Dieng. Selain wisatanya yang mendunia, daerah berudara dingin ini juga sangat ikonik dengan tradisi festival balon udara kertas, kuliner mie ongklok, serta produk lokal khas seperti buah carica dan teh Tambi.");
        marker.openPopup();


        // Tooltip
        marker.bindTooltip("Kabupaten Temanggung");
        marker.openTooltip();

        marker2.bindTooltip("Kecamatan Bansari");
        marker.openTooltip();

        marker3.bindTooltip("Kabupaten Wonosobo");
        marker.openTooltip();

        // Menambahkan marker ke dalam peta
        marker.addTo(map);
        marker2.addTo(map);
        marker3.addTo(map);


        // Circle
        var circle = L.circle([-7.3011741, 109.9967480], {
            color: "red", // warna garis
            opacity: 1, // opacity garis
            fillColor: "#f03", // warna fill
            fillOpacity: 0.5, // opacity fill
            radius: 1000, // radius dalam meter
        });

        // Menambahkan circle ke dalam peta
        circle.addTo(map);

        // Popup
        circle.bindPopup("<b>Hallo</b><br>Ini adalah popup circle");
        circle.openPopup();

        // Tooltip
        circle.bindTooltip("Ini adalah tooltip circle", { sticky: true });
        circle.openTooltip();


        // Polyline
        var vertexPolyline = [
            [-7.3161575, 110.1757050],
            [-7.2844873, 110.0589752],
            [-7.3597429, 109.9031067],
        ];
        var polyline = L.polyline(vertexPolyline, {
            color: "yellow", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
        });

        // Menambahkan polyline ke dalam peta
        polyline.addTo(map);

        // Popup
        polyline.bindPopup("<b>Hallo</b><br>Ini adalah popup polyline");
        polyline.openPopup();

        // Tooltip
        polyline.bindTooltip("Ini adalah tooltip polyline", { sticky: true });
        polyline.openTooltip();

        // Polygon
        var vertexPolygon = [
            [-7.3297784, 110.0795746],
            [-7.3284163, 110.1832581],
            [-7.4019622, 110.1956177],
            [-7.4087714, 110.0349426],
            [-7.3311405, 110.0301361]
        ];
        var polygon = L.polygon(vertexPolygon, {
            color: "purple", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
            fillColor: "#0f3", // warna fill
            fillOpacity: 0.5, // opacity fill
        });

        // Menambahkan polygon ke dalam peta
        polygon.addTo(map);

        // Popup
        polygon.bindPopup("<b>Hallo</b><br>Ini adalah popup polygon");
        polygon.openPopup();

        // Tooltip
        polygon.bindTooltip("Ini adalah tooltip polygon");
        polygon.openTooltip();

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
            "Google Satellite": Google_Satellite,


        };

        var overlayMaps = {
            "Temanggung": marker,
            "Bansari": marker2,
            "Wonosobo": marker3,
            "Circle": circle,
            "Line": polyline,
            "Polygon": polygon,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });
        controllayer.addTo(map);

        // Scale 
        var scale = L.control.scale({
            position: "bottomright",
        });
        scale.addTo(map);

        // Geolocation
        map.locate({
            setView: true,
            maxZoom: 16,
        });

        // Fungsi untuk menampilkan lokasi
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            // Menampilkan marker pada lokasi 
            L.marker(e.latlng).addTo(map).bindPopup("Anda berada dalam radius " + radius + " meter dari titik ini").openPopup();

            // Menampilkan circle pada lokasi
            L.circle(e.latlng, radius).addTo(map);
        }

        map.on("locationfound", onLocationFound);

        // Fungsi untuk menampilkan pesan error
        function onLocationError(e) {
            alert(e.message);
        }

        map.on("locationerror", onLocationError);
    </script>
</body>

</html>
